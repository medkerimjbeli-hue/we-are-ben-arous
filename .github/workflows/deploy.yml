name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write only to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run geo:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:verify
      - name: Build
        run: npm run build
        env:
          # Base path of the Pages site, e.g. "/WE-ARE-BEN-AROUS/". Override with the PAGES_BASE_PATH
          # repository variable when using a custom domain ("/").
          VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('{0}/', steps.pages.outputs.base_path) }}
          VITE_SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          # Public values only (protected by RLS). NEVER add the service-role key here.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
